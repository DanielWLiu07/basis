name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Physical design (levelization)
        run: ./scripts/levelize.py src

      - name: Benchmark inputs are committed
        # A benchmark whose input is gitignored works perfectly for its
        # author and for nobody else, and running it proves nothing -
        # the only way to catch it is to ask whether the input ships.
        run: python3 scripts/check_bench_inputs.py

      - name: Contracts script unit tests
        # Pure parsing and date arithmetic only. The network half is not
        # exercised here on purpose: a CI job that needs Polymarket to be
        # up fails for reasons unrelated to this repo.
        run: python3 tests/test_contracts_script.py
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Book reconstruction verified against the venue snapshot
        run: |
          gunzip -c docs/bench/btcusdt-recon.feedlog.gz > /tmp/recon.feedlog
          ./build/src/basis book-verify /tmp/recon.feedlog --levels 20
      - name: End-to-end smoke (synth + replay)
        run: |
          ./build/src/basis synth demo.feedlog --steps 2000 --lead-ms 400
          ./build/src/basis replay demo.feedlog --config configs/synthetic.toml

  net-build:
    name: net build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install Boost + OpenSSL
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libboost-dev libssl-dev
          else
            brew install boost openssl@3
          fi
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBASIS_ENABLE_NET=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: README flag check
        # Runs here rather than in build-test because record and live only
        # appear in the usage text of a BASIS_ENABLE_NET build, so a
        # non-net binary would report the README's live-capture flags as
        # missing.
        run: ./scripts/check_readme_flags.py ./build/src/basis

  # macOS only: Homebrew bottles BDE; Linux has no packaged BDE and building
  # it from source is too heavy for a per-commit job.
  bde-build:
    name: bde build (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install BDE
        run: brew install bde
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBASIS_ENABLE_BDE=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Allocator smoke (arena + counting replay)
        run: |
          ./build/src/basis synth demo.feedlog --steps 2000 --lead-ms 400
          ./build/src/basis replay demo.feedlog --config configs/synthetic.toml --alloc bde
          ./build/src/basis replay demo.feedlog --config configs/synthetic.toml --alloc count

  sanitizers:
    name: ${{ matrix.san }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - san: asan-ubsan
            flags: -DBASIS_SANITIZE=ON
          - san: tsan
            flags: -DBASIS_SANITIZE_THREAD=ON
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug ${{ matrix.flags }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Short-budget fuzz of every untrusted-input surface on every commit;
  # long runs happen locally. Any crash artifact fails the job.
  fuzz:
    name: fuzz (short budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: >
          CC=clang CXX=clang++ cmake -B build-fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBASIS_ENABLE_FUZZ=ON
      - name: Build
        run: cmake --build build-fuzz -j
      - name: Fuzz
        run: |
          ./build-fuzz/fuzz/fuzz_kalshi_parser -runs=100000 -max_len=4096 fuzz/corpus/kalshi
          ./build-fuzz/fuzz/fuzz_polymarket_parser -runs=100000 -max_len=4096 fuzz/corpus/polymarket
          ./build-fuzz/fuzz/fuzz_contract_registry -runs=100000 -max_len=4096 fuzz/corpus/registry

  # Asserts on every commit: the closed loop still recovers the injected
  # lead, integrity counters stay at zero, the hot path stays within its
  # allocation budget, and throughput stays above a floor with ~10x
  # headroom (regression catcher, not a benchmark; measured numbers live
  # in docs/bench/).
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Gate
        run: ./scripts/perf_gate.sh
